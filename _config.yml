###############################################################################
# Base site configuration
###############################################################################

title: "Enterprise IT Wiki"
description: "Documentazione tecnica enterprise – Architettura, Security, DevOps"

###############################################################################
# Theme configuration
###############################################################################

remote_theme: just-the-docs/just-the-docs

###############################################################################
# Build & markdown
###############################################################################

markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  syntax_highlighter_opts:
    block:
      line_numbers: false

###############################################################################
# Search configuration (Just the Docs)
###############################################################################

search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

###############################################################################
# Navigation & UI
###############################################################################

# Sidebar sempre visibile (pattern wiki)
nav_enabled: true

# Ordine automatico basato su front matter nav_order
nav_sort: case_insensitive

# TOC automatico per pagina
toc:
  enabled: true
  heading_level: 2
  ordered: false

###############################################################################
# Footer / Branding
###############################################################################

footer_content: >
  © 2026 – Enterprise IT Wiki · Internal use only

###############################################################################
# Collections (struttura logica enterprise)
###############################################################################

collections:
  architecture:
    output: true
    permalink: /architecture/:path/
  security:
    output: true
    permalink: /security/:path/
  devops:
    output: true
    permalink: /devops/:path/
  operations:
    output: true
    permalink: /operations/:path/

###############################################################################
# Default front matter (governance)
###############################################################################

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default
      nav_exclude: false
  - scope:
      path: ""
      type: architecture
    values:
      layout: default
      parent: "Architecture"
  - scope:
      path: ""
      type: security
    values:
      layout: default
      parent: "Security"
  - scope:
      path: ""
      type: devops
    values:
      layout: default
      parent: "DevOps"
  - scope:
      path: ""
      type: operations
    values:
      layout: default
      parent: "Operations"

###############################################################################
# Just the Docs – Advanced options
###############################################################################

# Abilita link edit su GitHub (governance / contribution)
gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/<org>/<repo>"
gh_edit_branch: "main"
gh_edit_view_mode: "tree"

# Back to top
back_to_top: true
back_to_top_text: "Back to top"

###############################################################################
# Iframe & HTML embedding
###############################################################################

# Necessario per iframe e HTML embedded
plugins:
  - jekyll-include-cache

###############################################################################
# Excludes (igiene repository)
###############################################################################

exclude:
  - README.md
  - LICENSE
  - node_modules
  - vendor
  - Gemfile
  - Gemfile.lock

###############################################################################
# Strict mode (consigliato per ambienti enterprise)
###############################################################################

strict_front_matter: true
liquid:
  error_mode: strict
  strict_filters: true
  strict_variables: true
